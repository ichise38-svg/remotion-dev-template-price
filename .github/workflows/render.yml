name: Render Reel

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Render video
        uses: remotion-dev/action@v4
        with:
          composition-id: PriceValueReel
          entry-point: src/index.ts
          output-name: price-value-reel.mp4

      - name: Upload video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: price-value-reel
          path: price-value-reel.mp4
