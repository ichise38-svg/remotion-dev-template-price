name: Render Reel

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Check disk space
        run: df -h

      - name: Bundle
        run: npx remotion bundle src/index.ts --output=./build

      - name: List build output
        run: ls -la ./build

      - name: Render video
        run: npx remotion render ./build PriceValueReel out/price-value-reel.mp4

      - name: Upload video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: price-value-reel
          path: out/price-value-reel.mp4
